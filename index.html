<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutor Workday</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="packages/ui/tokens.css">
  <link rel="stylesheet" href="packages/ui/base.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">TW</span>
    <span class="brand-name">Tutor Workday<small>AIPS Hackathon prototype</small></span></a></header>
  <div class="band"></div>
  <main class="page">
    <div class="page-head"><h1>Choose a portal</h1><p class="lede">Demo mode with mock data. Open both in separate tabs to see a student upload arrive in the staff marking queue.</p></div>
    <div class="grid-2">
      <section class="card"><div class="card-head"><h2>Staff portal</h2></div>
        <div class="tiles" style="grid-template-columns:1fr"><a class="tile" style="aspect-ratio:auto;padding:32px" href="apps/staff/"><i class="ti ti-school" aria-hidden="true"></i>Tutors and managers</a></div></section>
      <section class="card"><div class="card-head"><h2>Student portal</h2></div>
        <div class="tiles" style="grid-template-columns:1fr"><a class="tile" style="aspect-ratio:auto;padding:32px" href="apps/student/"><i class="ti ti-backpack" aria-hidden="true"></i>Students</a></div></section>
    </div>
    <p class="muted">Earlier single-page prototype: <a href="prototype/">prototype/</a></p>
  </main>
</body>
</html>
